name: Release Image Build and Push
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step creates the GitHub Release for this tag.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MAJOR_MINOR="${VERSION%.*}"
          echo "full=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/darkgrotto/countorsell:${{ steps.version.outputs.full }}
            ghcr.io/darkgrotto/countorsell:${{ steps.version.outputs.major_minor }}
            ghcr.io/darkgrotto/countorsell:${{ steps.version.outputs.major }}
            ghcr.io/darkgrotto/countorsell:latest
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_BUILD_TAG=${{ steps.version.outputs.full }}

      # A tag alone does not create a Release, and AppVersionService reads the release API
      # (api.github.com/.../releases/latest) to decide whether an update is available. Doing
      # this by hand was a step that silently no-ops when forgotten: the images publish, so
      # the release looks complete, while no instance is ever told an update exists.
      #
      # Runs last so a release is never announced for an image that failed to publish.
      # Uses the runner's preinstalled gh rather than a third-party action: there is no
      # dependabot.yml here, so an action pin would never be updated.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - leaving it unchanged."
            exit 0
          fi
          # --latest is what points releases/latest at this tag, which is the exact field
          # the in-app update check reads.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --latest
