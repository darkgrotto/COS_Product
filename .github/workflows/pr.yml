name: PR Build and Test
on:
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN. This workflow only checks out the
# repo and builds/tests - it needs read access to contents and nothing else.
permissions:
  contents: read

jobs:
  # Builds the client outside Docker, on the Node version declared in .nvmrc.
  # The Docker build already compiles the frontend, but only ever on the image's
  # own Node, so nothing previously exercised the toolchain a contributor uses
  # locally - or checked that .nvmrc, engines and the Dockerfile agree.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/CountOrSell.Api/Client/package-lock.json
      - name: Install (locked tree, engine-strict)
        working-directory: src/CountOrSell.Api/Client
        run: npm ci
      - name: Build
        working-directory: src/CountOrSell.Api/Client
        run: npm run build

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/CountOrSell.sln
      - name: Build
        run: dotnet build src/CountOrSell.sln --no-restore --configuration Release /warnaserror
      - name: Test
        run: dotnet test src/CountOrSell.sln --no-build --configuration Release --verbosity normal
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker build (linux/amd64, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
