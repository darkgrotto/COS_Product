# Generated by CountOrSell first-run wizard. Do not edit manually.
# To regenerate, run the wizard again.
#
# Values come from the .env file in the deployment root. This file is safe to commit:
# it contains no credentials.
# Every globally-unique name derives from this, so two CountOrSell deployments can run
# side by side on one Docker host. Defaults to countorsell, which keeps the volume names
# byte-identical to what single-instance deployments already have - the data lives there.
name: ${COS_PROJECT_NAME:-countorsell}

services:
  app:
    # One variable holding the whole reference. Splitting it into registry + name would
    # double the name, because the wizard prompt collects the full repository path.
    # Defaulted so an unset value cannot produce an invalid reference.
    image: ${APP_IMAGE:-ghcr.io/darkgrotto/countorsell:latest}
    container_name: ${COS_PROJECT_NAME:-countorsell}-app
    environment:
      # Kestrel's listen port, which nginx proxies to. Pinned rather than inherited:
      # PORT in .env is the published HTTPS port, a different thing with the same name,
      # and letting that reach the app would leave nginx proxying to the wrong port.
      - PORT=3000
      # Service name, not container name: Compose resolves it on the project network, so
       # it stays correct however the containers end up named.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-countorsell}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - INSTANCE_NAME=${INSTANCE_NAME}
      - UPDATE_CHECK_TIME=${UPDATE_CHECK_TIME}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE}
      - BACKUP_RETENTION=${BACKUP_RETENTION}
      - BLOB_BACKUP_CONNECTION=${BLOB_BACKUP_CONNECTION}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - ImageStore__BasePath=/app/data/images
      - BACKUP_LOCAL_PATH=/app/data/backups
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ${COS_PROJECT_NAME:-countorsell}-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-countorsell}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ so the shell inside the container expands these, not Compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine
    container_name: ${COS_PROJECT_NAME:-countorsell}-reverse-proxy
    ports:
      # Defaulted so an unset PORT cannot produce ":443", which Compose rejects.
      - "${PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  # Deliberately unnamed: Compose prefixes the project, giving countorsell_postgres_data
  # by default - the name existing deployments already use - and a distinct volume per
  # project for any other instance. A pinned name would be global, so every deployment on
  # the host would silently share one database.
  postgres_data:
  app_data:
