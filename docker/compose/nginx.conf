server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/countorsell.crt;
    ssl_certificate_key /etc/nginx/certs/countorsell.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        # 3000 is the app's Kestrel port (Program.cs: PORT ?? 3000, pinned to 3000 by
        # the app service). 8080 was the base image's ASPNETCORE_HTTP_PORTS, which the
        # Dockerfile now clears - proxying there returns 502 on every request.
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
